[profile.default]
# Circuit simulations can legitimately take minutes for complex transient
# analyses. nextest runs each test in its own process and sends SIGTERM then
# SIGKILL when the timeout fires, so hung tests are actually killed (unlike the
# old thread-based timeout which left threads spinning forever).
#
# Warn after 60s, kill after 4 periods (240s total).
slow-timeout = { period = "60s", terminate-after = 4 }
