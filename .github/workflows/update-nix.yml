name: Update Nix flake inputs

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: nix flake update

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "deps(nix): update flake inputs"
          title: "deps(nix): update flake inputs"
          body: |
            Automated weekly update of Nix flake inputs (`nixpkgs`, `flake-utils`, `rust-overlay`, `crane`).

            Run `nix flake metadata` to inspect the new revisions.
          branch: dependabot/nix/flake-inputs
          delete-branch: true
          labels: dependencies
