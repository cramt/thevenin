[workspace]
members = [
    "thevenin-types",
    "thevenin-xspice",
    "thevenin",
    "thevenin-control",
    "thevenin-test-macro",
    "cirq-ast",
    "cirq-ir",
    "cirq-grammar",
    "cirq-control-grammar",
    "cirq-frontend",
    "cirq-spice-import",
    "thevenin-cirq",
]
exclude = ["experiments"]
resolver = "3"

[workspace.package]
# Single source of truth for the workspace version. The first crates.io
# release ships every crate at a unified 0.5.0 (not 1.0 — see docs/1.0-checklist.md).
version = "0.5.0"

[workspace.dependencies]
thiserror = "2"
facet = "0.46"
wasm-bindgen-test = "0.3"
faer = {version = "0.24", default-features = false, features = ["npy", "rand", "sparse-linalg", "std"]}
[target.'cfg(not(target_family = "wasm"))'.dependencies]
faer = {version = "0.24", default-features = false, features = ["npy", "rand", "rayon", "sparse-linalg", "std"]}
[target.'cfg(target_arch = "wasm32")'.dependencies]
# 0.4 for our direct/workspace use, 0.3 for the transitive copy pulled in by
# faer -> rand 0.9 -> rand_core 0.9. Both need the wasm_js feature so the
# `getrandom_backend="wasm_js"` cfg in .cargo/config.toml resolves correctly.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 3           # release-grade optimizations for cargo test / cargo build
debug = true            # full debug info — backtraces show file/line on panic
overflow-checks = true  # catch integer overflow bugs

[profile.test-release]
inherits = "release"
debug = true
overflow-checks = true

[package]
name = "thevenin-cli"
version.workspace = true
edition = "2024"
description = "CLI for thevenin - a Rust rewrite of ngspice circuit simulator"
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"
publish = false

[dependencies]
thevenin-types = { path = "thevenin-types", version = "0.5.0" }
thevenin = { path = "thevenin", version = "0.5.0" }
thevenin-control = { path = "thevenin-control", version = "0.5.0" }
cirq-ir = { path = "cirq-ir", version = "0.5.0" }
cirq-frontend = { path = "cirq-frontend", version = "0.5.0" }
cirq-spice-import = { path = "cirq-spice-import", version = "0.5.0" }
facet.workspace = true

# figue 4 added an HTML-help feature whose `open_file_command` only has
# cfg branches for macos/windows/unix — it doesn't compile on
# wasm32-unknown-unknown. The CLI binary is host-only anyway, so the dep
# (and main.rs's body) are gated to non-wasm targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
figue = "4"

[dev-dependencies]
wasm-bindgen-test.workspace = true
