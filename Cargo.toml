[workspace]
members = [
    "thevenin-types",
    "thevenin-xspice",
    "thevenin",
    "thevenin-control",
    "thevenin-test-macro",
    "cirq-ast",
    "cirq-ir",
    "cirq-grammar",
    "cirq-frontend",
    "cirq-spice-import",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2"
facet = "0.44"
wasm-bindgen-test = "0.3"
faer = {version = "0.24", default-features = false, features = ["npy", "rand", "sparse-linalg", "std"]}
[target.'cfg(not(target_family = "wasm"))'.dependencies]
faer = {version = "0.24", default-features = false, features = ["npy", "rand", "rayon", "sparse-linalg", "std"]}
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[profile.dev]
opt-level = 3           # release-grade optimizations for cargo test / cargo build
debug = true            # full debug info — backtraces show file/line on panic
overflow-checks = true  # catch integer overflow bugs

[profile.test-release]
inherits = "release"
debug = true
overflow-checks = true

[package]
name = "thevenin-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for thevenin - a Rust rewrite of ngspice circuit simulator"
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"
publish = false

[dependencies]
thevenin-types = { path = "thevenin-types", version = "0.3.0" }
thevenin = { path = "thevenin", version = "0.3.0" }
thevenin-control = { path = "thevenin-control", version = "0.1.0" }
cirq-ir = { path = "cirq-ir", version = "0.1.0" }
cirq-frontend = { path = "cirq-frontend", version = "0.1.0" }
cirq-spice-import = { path = "cirq-spice-import", version = "0.1.0" }
facet.workspace = true
figue = "2"

[dev-dependencies]
wasm-bindgen-test.workspace = true
