[package]
name = "cirq-frontend"
version = "0.1.0"
edition = "2024"
description = "Cirq frontend pipeline: source → AST → IR → Netlist"
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"

[dependencies]
cirq-ast = { path = "../cirq-ast", version = "0.1.0" }
cirq-grammar = { path = "../cirq-grammar", version = "0.1.0" }
cirq-ir = { path = "../cirq-ir", version = "0.1.0" }
thevenin-types = { path = "../thevenin-types", version = "0.2.0" }
thiserror.workspace = true
tree-sitter = "0.25"

[dev-dependencies]
thevenin = { path = "../thevenin", version = "0.2.0" }
thevenin-control = { path = "../thevenin-control", version = "0.1.0" }
cirq-spice-import = { path = "../cirq-spice-import", version = "0.1.0" }
thevenin-types = { path = "../thevenin-types", version = "0.2.0" }
tempfile = "3"
