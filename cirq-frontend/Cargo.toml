[package]
name = "cirq-frontend"
version.workspace = true
edition = "2024"
description = "Cirq frontend pipeline: source → AST → IR → Netlist"
keywords = ["cirq", "compiler", "circuit", "spice", "eda"]
categories = ["compilers", "parser-implementations"]
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"

[dependencies]
cirq-ast = { path = "../cirq-ast", version = "0.5.0" }
cirq-grammar = { path = "../cirq-grammar", version = "0.5.0" }
cirq-ir = { path = "../cirq-ir", version = "0.5.0" }
thevenin-types = { path = "../thevenin-types", version = "0.5.0" }
thiserror.workspace = true
tree-sitter = "0.26"

[dev-dependencies]
thevenin = { path = "../thevenin" }
thevenin-control = { path = "../thevenin-control" }
cirq-spice-import = { path = "../cirq-spice-import" }
thevenin-types = { path = "../thevenin-types" }
tempfile = "3"
