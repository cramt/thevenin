[package]
name = "cirq-spice-import"
version.workspace = true
edition = "2024"
description = "SPICE netlist to Cirq IR converter"
keywords = ["spice", "import", "cirq", "ngspice", "netlist"]
categories = ["parser-implementations", "science"]
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"

[dependencies]
cirq-ir = { path = "../cirq-ir", version = "0.5.0" }
thevenin = { path = "../thevenin", version = "0.5.0" }
thevenin-types = { path = "../thevenin-types", version = "0.5.0" }
thiserror.workspace = true

[dev-dependencies]
cirq-frontend = { path = "../cirq-frontend" }
tempfile = "3"
