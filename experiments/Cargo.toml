# Isolated spike workspace for the snark + weavy experiment.
#
# Kept OUT of the root thevenin workspace (see root Cargo.toml `exclude`) so the
# main crates stay pinned to facet 0.46 (crates.io) while this sandbox pulls the
# facet 0.50-rc world that snark/weavy require from Amos' unmerged branch.
[workspace]
members = ["spike-weavy", "spike-snark", "spike-cirq-ast", "spike-ts-diff"]
resolver = "3"

[workspace.dependencies]
# All four resolve from Alex's facet fork branch = facet-rs/main (which now
# carries the merged snark/weavy of PR #2431) + the one keyword-escape commit of
# PR #2465 (https://github.com/facet-rs/facet/pull/2465). That commit fixes
# snark-dsl's `rust_field_name`, so the spike no longer needs the build-time
# grammar patch that renamed cirq's `else` field. As of 2026-07-10 the PR branch
# is up to date with upstream main (merge-base == main HEAD, behind_by 0).
# Switch these back to `facet-rs/facet` on whichever branch/tag carries the fix
# once #2465 lands upstream.
snark = { git = "https://github.com/cramt/facet", branch = "fix/typed-ast-keyword-fields" }
weavy = { git = "https://github.com/cramt/facet", branch = "fix/typed-ast-keyword-fields" }
facet = { git = "https://github.com/cramt/facet", branch = "fix/typed-ast-keyword-fields" }
# The typed-AST codegen (grammar.js + annotations -> Rust AST + lowering). The
# `typed-ast` feature pulls boa_engine, so grammar.js runs with no node.
snark-dsl = { git = "https://github.com/cramt/facet", branch = "fix/typed-ast-keyword-fields", features = ["typed-ast"] }
