[package]
name = "thevenin-cirq"
version = "0.1.0"
edition = "2024"
description = "Parse-and-simulate convenience entry points pairing SPICE/Cirq import with the thevenin simulator"
keywords = ["spice", "circuit", "simulation", "cirq", "ngspice"]
categories = ["science", "simulation"]
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"

[dependencies]
cirq-ir = { path = "../cirq-ir", version = "0.1.0" }
cirq-spice-import = { path = "../cirq-spice-import", version = "0.1.0" }
thevenin = { path = "../thevenin", version = "0.3.0" }
thevenin-types = { path = "../thevenin-types", version = "0.3.0" }
thiserror.workspace = true

[dev-dependencies]
cirq-frontend = { path = "../cirq-frontend" }
