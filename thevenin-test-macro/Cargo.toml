[package]
name = "thevenin-test-macro"
version = "0.1.1"
edition = "2024"
description = "Proc macro for generating ngspice integration tests"
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
