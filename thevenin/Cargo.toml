[package]
name = "thevenin"
version.workspace = true
edition = "2024"
description = "Core simulation engine for thevenin: sparse matrices, MNA assembly, solvers"
keywords = ["spice", "circuit", "simulation", "ngspice", "eda"]
categories = ["science", "simulation", "mathematics"]
license = "BSD-3-Clause"
repository = "https://github.com/cramt/thevenin"

[dependencies]
thiserror.workspace = true
faer.workspace = true
thevenin-types = { path = "../thevenin-types", version = "0.5.0" }
thevenin-xspice = { path = "../thevenin-xspice", version = "0.5.0" }
cirq-ir = { path = "../cirq-ir", version = "0.5.0" }
cirq-frontend = { path = "../cirq-frontend", version = "0.5.0" }
libm = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "1"

[dev-dependencies]
approx = "0.5"
wasm-bindgen-test.workspace = true
getrandom = { version = "0.4", features = ["wasm_js"] }
web-time = "1"
thevenin-test-macro = { path = "../thevenin-test-macro" }
thevenin-control = { path = "../thevenin-control" }
cirq-spice-import = { path = "../cirq-spice-import" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen = "0.2"
