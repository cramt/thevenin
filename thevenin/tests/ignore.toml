# === BSIM3SOI-DD ===
# RampVg2: un-ignored 2026-07-02 after three stacked fixes:
# (a) XJ sentinel re-resolved against the model card's TSI (set-time
#     default, b3soiddset.c:215) — fixed the DC OP Vbs to 7 digits.
# (b) Numerically stable Phi^1.5/Phi^2.5 differences in the CAPMOD=3
#     charge block — fixed the pre-ramp floating-body drift.
# (c) The decisive one: the deck sets `debug=-1`, which in ngspice's
#     b3soiddld.c is LOAD-BEARING — it forces ChargeComputationNeeded=0
#     after the charge block (`goto line850`), skipping overlap caps and
#     all NIintegrate calls. The reference waveform is the quasi-static
#     body response with NO capacitive currents. Our port now honors
#     debug=-1 the same way (Bsim3SoiDdInstance::debug_mod).

