# === HFET ===
# hfet/inverter.cir: un-ignored 2026-07-02. ngspice's upstream reference .out
# is wrong: in hfetload.c, `int inverse=FALSE;` is declared outside the device
# iteration loop and never reset per instance, so a driver HFET with vds<0
# leaks inverse=TRUE into subsequently-processed load HFETs, wrongly negating
# their cdrain (spurious V(3)=-0.275V; the correct DC OP is V(3)≈1.956V, see
# `test_hfet_inverter_dc_op` in tests/hfet.rs). Reference regenerated from an
# ngspice build patched to reset `inverse = FALSE;` per instance; the fixture
# override lives at thevenin/tests/fixtures/hfet/inverter.out.

